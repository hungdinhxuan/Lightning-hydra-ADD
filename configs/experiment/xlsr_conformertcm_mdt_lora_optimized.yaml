# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: MDT_optimized
  - override /model: xlsr_conformertcm_MDT_LoRA
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["MDT_optimized", "xlsr_conformertcm_MDT_LoRA"]

seed: 1234

model:
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.00005 # 5e-5
    weight_decay: 0.0001
  net: null
  scheduler:
    _target_: torch.optim.lr_scheduler.MultiStepLR
    _partial_: true
    milestones:
      - 5
      - 15
    gamma : 0.1 # Multiplicative factor of learning rate decay.

  cross_entropy_weight: [0.5, 0.5] # amplify bonafide loss
  args:
    adapter:
      r: 8
      target_modules: ["q_proj", "v_proj", "k_proj", "out_proj", "fc1", "fc2", "final_proj"]
      #target_modules: ["q_proj", "v_proj", "k_proj", "out_proj"] 
      modules_to_save:  ["backend"] # conformer qkv
      lora_dropout: 0.0
      lora_alpha: 16
      #init_lora_weights: "gaussian"
    conformer:
      emb_size: 144
      heads: 4
      kernel_size: 31
      n_encoders: 4
      type: "conv" # conv_res2net, conv_seblock, conv_res2net_seblock
      pooling: "first"
  
data:
  batch_size: 32
  num_workers: 8
  pin_memory: true
  data_dir: ${oc.env:NOISE_DATASET_PATH}

  args:
    protocol_path: ${oc.env:NOISE_DATASET_PROTOCOL}
    augmentation_methods: ["RawBoostdf", "none"] # "none" is the original data
    padding_type: repeat
    random_start: True
    is_dev_aug: False
    wds_data_dir: ${oc.env:WDS_DATA_DIR}
    wds_shm_dir: ${oc.env:WDS_SHM_DIR,null}
    wds_shard_shuffle: 100
    wds_sample_shuffle: 2000
    view_padding_configs:
      '1':
        padding_type: repeat
        random_start: True
      '2':
        padding_type: repeat
        random_start: True
      '3':
        padding_type: repeat
        random_start: True
      '4':
        padding_type: repeat
        random_start: True