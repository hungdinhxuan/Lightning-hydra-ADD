# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: MDT_optimized
  - override /model: xlsr_conformertcm_MDT
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["MDT_optimized", "xlsr_conformertcm_MDT"]

seed: 1234

model:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.00005 # 5e-5
    weight_decay: 0.0001
  net: null
  scheduler:
    _target_: torch.optim.lr_scheduler.MultiStepLR
    _partial_: true
    milestones:
      - 5
      - 15
    gamma : 0.1 # Multiplicative factor of learning rate decay.

  cross_entropy_weight: [0.5, 0.5] # amplify bonafide loss
  
data:
  batch_size: 16
  num_workers: 8
  pin_memory: true
  data_dir: ${oc.env:NOISE_DATASET_PATH}

  args:
    protocol_path: ${oc.env:NOISE_DATASET_PROTOCOL}
    augmentation_methods: ["RawBoostdf", "none"] # "none" is the original data
    padding_type: repeat
    random_start: True
    is_dev_aug: False
    wds_data_dir: ${oc.env:WDS_DATA_DIR}
    wds_shm_dir: ${oc.env:WDS_SHM_DIR,null}
    wds_shard_shuffle: 100
    wds_sample_shuffle: 2000
    view_padding_configs:
      '1':
        padding_type: repeat
        random_start: True
      '2':
        padding_type: repeat
        random_start: True
      '3':
        padding_type: repeat
        random_start: True
      '4':
        padding_type: repeat
        random_start: True